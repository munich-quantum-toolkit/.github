# To run all pre-commit checks, use:
#
#     uvx prek run -a
#
# To install pre-commit hooks that run every time you commit:
#
#     uv tool install prek
#     prek install
#

ci:
  autoupdate_commit_msg: "⬆️🪝 update pre-commit hooks"
  autoupdate_schedule: quarterly
  autofix_commit_msg: "🎨 pre-commit fixes"

repos:
  ## Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: trailing-whitespace
        priority: 2

  ## Check JSON schemata
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
        priority: 0
      - id: check-readthedocs
        priority: 0

  ## Check for security issues in GitHub Actions workflows
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        priority: 0

  ## Check for common capitalization mistakes
  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: \b(Numpy|Github|PyTest|Mqt|Tum)\b
        exclude: ^(\.pre-commit-config\.yaml)$
        exclude_types: [binary]
        priority: 0

  ## Check for typos
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.49.0
    hooks:
      - id: typos
        priority: 3

  ## Check license headers
  - repo: https://github.com/emzeat/mz-lictools
    rev: v2.9.0
    hooks:
      - id: license-tools
        priority: 4

  ## Format BibTeX files with bibtex-tidy
  - repo: https://github.com/FlamingTempura/bibtex-tidy
    rev: v1.14.0
    hooks:
      - id: bibtex-tidy
        args:
          [
            "--align=20",
            "--curly",
            "--months",
            "--blank-lines",
            "--sort",
            "--strip-enclosing-braces",
            "--sort-fields",
            "--trailing-commas",
            "--remove-empty-fields",
          ]
        priority: 5

  ## Format configuration files with prettier
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, html, css, scss, javascript, json, json5]
        priority: 5

  ## Format Markdown files with rumdl
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.60
    hooks:
      - id: rumdl
        args: [--fix]
        priority: 5
      - id: rumdl-fmt
        priority: 6

  ## Format and lint Python files with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        require_serial: true
        priority: 6
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]
        priority: 7
